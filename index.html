<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dayjs@1/locale/pt-br.js"></script>
  <script>dayjs.locale('pt-br')</script>
  
</head>
<body>
  <div id="app">
    <form onsubmit="salvarAtividade(event)">
      <!-- onsubmit: disparo -->
       <div id="place" class="card-bg">
          <img width="24" height="24" src="https://img.icons8.com/fluency-systems-regular/48/EBEBEB/marker--v1.png" alt="marker--v1"/>

          Recife, PE 
      </div>
       <div class="fields">
         <div class="field-wrapper">

          <img width="24" height="24" src="https://img.icons8.com/forma-light/24/EBEBEB/price-tag.png" alt="price-tag"/>

           <input
             type="text" 
             placeholder="Qual a atividade?" name="atividade"
             required
           >
         </div>
   
         <div class="field-wrapper">

          <img width="24" height="24" src="https://img.icons8.com/material-rounded/24/EBEBEB/calendar--v1.png" alt="calendar--v1"/>

           <select name="dia" >
             <option value="20-03-01">01 de feveiro</option>
           </select>
         </div>
     
         <div class="field-wrapper">
            <img width="24" height="24" src="https://img.icons8.com/forma-light/24/EBEBEB/time.png" alt="time"/>
      
           <select name="hora">
             <option value="10:30">10:30</option>
           </select>
         </div>

       </div>
  
      <button>Salvar atividade</button>
    </form>
  </div>

  <main>

    <h1>Atividades</h1>
  
    <section>
      <!--<div>
          <input type="checkbox">
          <span>Tarefa de Coding: Mobile</span>
          <time>Segunda, 24 de Agosto às 18h </time>
        </div> -->
      </section> 
  
    <script src="script.js"></script>
  </main>
  
</body>
